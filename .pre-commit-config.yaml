# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # v2.15.1
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        description: Runs hadolint Docker image to lint Dockerfiles
        language: docker_image
        types: ["dockerfile"]
        entry: ghcr.io/hadolint/hadolint hadolint

  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc # 26.10.1
    hooks:
      - id: black
        name: Black
        description: The uncompromising Python code formatter
        language_version: python3
        types: [python]
        args:
          - --line-length=130

  - repo: https://github.com/pycqa/isort
    rev: 9f905615631c545f5aea2516508109350d1d2f7d # 9.0.2
    hooks:
      - id: isort
        name: isort
        description: A Python utility for sorting imports
        language_version: python3
        types: [python]
        args:
          - --profile=black
          - --line-length=130

  - repo: https://github.com/pycqa/flake8
    rev: 7eccf20b526fe4f2230bf9afeeef2fc9f97faf8d # 7.4.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=130

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 38980559e3a605691d6579f96222c30778e5a69e # 3.0.0
    hooks:
      - id: shellcheck
